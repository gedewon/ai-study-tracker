<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>AI Engineer Plan</title>
  <meta name="description" content="Daily study tracker for a 6-month plan from backend engineer to AI engineer.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121210">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Plan">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><b>AI Engineer</b><small>6-month plan</small></span>
      </div>
      <nav class="side-nav">
        <a href="#/today" data-tab="today">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="3"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/></svg>Today</a>
        <a href="#/plan" data-tab="plan">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.5" cy="5" r=".9"/><circle cx="3.5" cy="10" r=".9"/><circle cx="3.5" cy="15" r=".9"/></svg>Plan</a>
        <a href="#/progress" data-tab="progress">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5h14M5.5 13v-3M10 13V6M14.5 13V9"/></svg>Progress</a>
      </nav>
      <div class="side-foot">
        <small>Overall</small>
        <span class="num" id="side-pct">0%</span>
      </div>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Navigation">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="3"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/></svg><span>Today</span></a>
    <a href="#/plan" data-tab="plan">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.5" cy="5" r=".9"/><circle cx="3.5" cy="10" r=".9"/><circle cx="3.5" cy="15" r=".9"/></svg><span>Plan</span></a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5h14M5.5 13v-3M10 13V6M14.5 13V9"/></svg><span>Progress</span></a>
  </nav>

  <div id="toaster" class="toaster" aria-live="polite"></div>

  <noscript><p style="padding:2rem">This tracker needs JavaScript to run.</p></noscript>
  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
